name: release
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified version tag to npm and GitHub
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run verify:pack
      - uses: actions/upload-artifact@v4
        with:
          name: verified-release
          path: |
            .artifacts/toskill-*.tgz
            .artifacts/package-manifest.json
          if-no-files-found: error
          include-hidden-files: true
  publish:
    if: inputs.publish
    needs: candidate
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@v4
        with:
          name: verified-release
          path: verified
      - name: Require matching version tag and archive digest
        env:
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),m=JSON.parse(fs.readFileSync('verified/package-manifest.json'));
          if(process.env.RELEASE_REF_TYPE!=='tag'||process.env.RELEASE_REF!=='v'+m.version)throw Error('version tag required');
          const archive='verified/'+m.archive;
          if(crypto.createHash('sha256').update(fs.readFileSync(archive)).digest('hex')!==m.sha256)throw Error('archive digest mismatch');
          fs.writeFileSync('archive-path.txt',archive);
          NODE
          npm install --global npm@11.6.2
      - name: Publish exact tested archive using configured trusted publisher
        run: npm publish "$(cat archive-path.txt)" --provenance --access public
      - name: Publish GitHub release after registry success
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ github.ref_name }}
        run: gh release create "$RELEASE_REF" verified/*.tgz verified/package-manifest.json --verify-tag --generate-notes
